apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: url-shortener-envs
  namespace: argocd
spec:
  generators:
  - list:
      elements:
      - env: dev
      - env: staging
      - env: prod
  template:
    metadata:
      name: 'url-shortener-{{env}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/yourusername/url-shortener-gitops.git
        targetRevision: HEAD
        path: 'k8s/overlays/{{env}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{env}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
