apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: url-shortener-api
  template:
    metadata:
      labels:
        app: url-shortener-api
    spec:
      containers:
      - name: api
        image: 381940662325.dkr.ecr.ap-south-1.amazonaws.com/url-shortener-api:4ac785c272340af0d07adcab0775af0dea631c63
        ports:
        - containerPort: 3001
        env:
        - name: PORT
          value: "3001"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: url-shortener-ui
  template:
    metadata:
      labels:
        app: url-shortener-ui
    spec:
      containers:
      - name: ui
        image: 381940662325.dkr.ecr.ap-south-1.amazonaws.com/url-shortener-ui:4ac785c272340af0d07adcab0775af0dea631c63
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
