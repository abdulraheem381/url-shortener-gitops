apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: error-rate-analysis
spec:
  metrics:
  - name: error-rate
    interval: 30s
    successCondition: result[0] <= 0.05
    failureLimit: 1
    provider:
      prometheus:
        address: http://prometheus.monitoring.svc:9090
        query: |
          sum(response_code{status=~"5.*",app="url-shortener-api"}) / sum(response_code{app="url-shortener-api"})
