apiVersion: v1
kind: Service
metadata:
  name: url-shortener-api
spec:
  ports:
  - port: 3001
    targetPort: 3001
  selector:
    app: url-shortener-api
---
apiVersion: v1
kind: Service
metadata:
  name: url-shortener-ui
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: url-shortener-ui
