apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
namespace: prod
namePrefix: prod-
commonLabels:
  env: prod

# Prod-specific replicas (higher than dev/staging)
patches:
  - target:
      kind: Deployment
      name: url-shortener-ui
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 5
  - target:
      kind: Rollout
      name: url-shortener-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 5
