services:
  url-shortener-api:
    build: ./apps/url-shortener-api
    ports:
      - "3001:3001"
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  url-shortener-ui:
    build: ./apps/url-shortener-ui
    ports:
      - "80:80"
    depends_on:
      - url-shortener-api

  redis:
    image: redis:alpine
    ports:
      - "6380:6379"
